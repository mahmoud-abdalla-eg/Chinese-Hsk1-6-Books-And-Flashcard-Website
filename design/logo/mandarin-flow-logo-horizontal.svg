<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256">
  <title>Mandarin Flow HSK - Horizontal Logo</title>
  <defs>
    <linearGradient id="h_scarlet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="h_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left: Brand Icon Mark (200x200 scaled in 256 box) -->
  <g id="Logo_Mark" transform="translate(28, 28)">
    <rect x="0" y="0" width="200" height="200" rx="50" fill="url(#h_scarlet)"/>
    <rect x="2" y="2" width="196" height="196" rx="48" fill="none" stroke="#fee2e2" stroke-width="4.5" stroke-opacity="0.5"/>
    <path d="M 6 60 C 6 36 24 18 48 18 L 152 18 C 176 18 194 36 194 60 L 194 92 C 130 85 86 99 6 113 Z" fill="url(#h_sheen)"/>
    <text x="100" y="145" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="132" fill="#ffffff" text-anchor="middle">汉</text>
    <circle cx="160" cy="46" r="10" fill="#facc15" stroke="#ffffff" stroke-width="2" stroke-opacity="0.75"/>
  </g>

  <!-- Right: Wordmark & Tagline -->
  <g id="Wordmark" transform="translate(268, 0)">
    <!-- Primary Title -->
    <text x="0" y="128" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="76" 
          fill="#0f172a" 
          letter-spacing="-0.03em">
      Mandarin<tspan fill="#dc2626">Flow</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="178" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="22" 
          fill="#64748b" 
          letter-spacing="0.22em">
      HSK 3.0 CHINESE LEARNING
    </text>

    <!-- Chinese Subtitle Badge -->
    <rect x="420" y="156" width="68" height="28" rx="6" fill="#f1f5f9"/>
    <text x="454" y="176" 
          font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-weight="800" 
          font-size="16" 
          fill="#0f766e" 
          text-anchor="middle">
      汉语
    </text>
  </g>
</svg>
